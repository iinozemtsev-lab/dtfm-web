<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>dtfm-web</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #59636e;
      --border: #d1d9e0;
      --card: #f6f8fa;
      --accent: #0969da;
      --danger: #cf222e;
      --live: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --border: #30363d;
        --card: #161b22;
        --accent: #2f81f7;
        --danger: #f85149;
        --live: #22c55e;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .brand img {
      width: 22px;
      height: 22px;
      border-radius: 5px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.04em;
    }
    .badge.idle {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .badge.live {
      background: var(--live);
      color: #ffffff;
    }
    .badge.reconnecting {
      background: #d97706;
      color: #ffffff;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .tab-info {
      font-size: 12px;
      word-break: break-all;
    }
    .tab-title {
      font-weight: 600;
      margin-bottom: 2px;
    }
    .tab-origin {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #ffffff;
    }
    button.secondary {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }
    button.danger {
      background: var(--danger);
      color: #ffffff;
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .token-box {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      word-break: break-all;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      margin-bottom: 8px;
      user-select: all;
    }
    .error {
      color: var(--danger);
      font-size: 12px;
      margin-top: 8px;
    }
    .note {
      color: var(--muted);
      font-size: 11px;
      margin-top: 8px;
      line-height: 1.4;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="icons/icon.svg" alt="dtfm-web">
      <span>dtfm-web</span>
    </div>
    <span id="statusBadge" class="badge idle">IDLE</span>
  </header>

  <section id="idleView">
    <div class="card">
      <label for="relayUrlInput">Relay WebSocket URL</label>
      <input id="relayUrlInput" type="text" value="wss://relay.dtfm.dev/ws" spellcheck="false">
    </div>
    <button id="shareBtn" class="primary">Share this tab</button>
    <p class="note">
      Read-only, end-to-end encrypted, pinned to this tab's origin only.
      Permissions are revoked automatically when you stop sharing or close the tab.
    </p>
  </section>

  <section id="liveView" class="hidden">
    <div class="card tab-info">
      <div id="tabTitle" class="tab-title"></div>
      <div id="tabOrigin" class="tab-origin"></div>
    </div>
    <div class="card">
      <label>Pairing Token (E2EE)</label>
      <div id="tokenBox" class="token-box"></div>
      <button id="copyTokenBtn" class="secondary">Copy Pairing Token</button>
    </div>
    <button id="stopBtn" class="danger">Stop Sharing</button>
  </section>

  <div id="errorBox" class="error hidden"></div>
  <script src="popup.js" type="module"></script>
</body>
</html>
