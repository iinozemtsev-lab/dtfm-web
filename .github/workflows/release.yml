name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Pre-Release Quality Gates
    if: >-
      github.repository == 'iinozemtsev-lab/dtfm-web' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EVENT_NAME: ${{ github.event_name }}
      INPUT_VERSION: ${{ inputs.version }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Validate strict SemVer tag
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$REF_NAME"
          fi

          semver_regex='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$TAG" == *$'\n'* || "$TAG" == *$'\r'* || ! "$TAG" =~ $semver_regex ]]; then
            echo "Error: Tag '$TAG' does not conform to strict SemVer (vMAJOR.MINOR.PATCH)!" >&2
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "✓ Validated strict SemVer tag: $TAG"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check release collision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api_output="$(gh api -i "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1 || true)"
          http_status="$(printf '%s\n' "$api_output" | awk '/^HTTP\/[0-9.]* / { status=$2; if (status !~ /^(1|3)/) exit } END { if (status != "") print status }')"
          if [ "$http_status" = "200" ]; then
            echo "Error: Published release '$TAG' already exists!" >&2
            exit 1
          elif [ "$http_status" != "404" ]; then
            echo "Error: Unexpected status checking release '$TAG' (HTTP ${http_status:-unknown})" >&2
            exit 1
          fi
          echo "✓ Confirmed no existing release for $TAG."

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run quality gates
        run: |
          go mod verify
          diffs=$(gofmt -s -d .)
          if [ -n "$diffs" ]; then
            echo "Unformatted Go files detected:"
            echo "$diffs"
            exit 1
          fi
          go vet ./...
          node --test extension/test/e2ee.test.mjs extension/test/content.test.mjs extension/test/background.test.mjs
          go test -v -race ./...
          echo "✓ All pre-release quality gates passed."

  build-and-publish:
    name: Build & Publish Release
    needs: verify
    if: >-
      github.repository == 'iinozemtsev-lab/dtfm-web' &&
      (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EVENT_NAME: ${{ github.event_name }}
      INPUT_VERSION: ${{ inputs.version }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Resolve SemVer tag
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_VERSION"
          else
            TAG="$REF_NAME"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go (hermetic, uncached)
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: false

      - name: Build static lmdtfy-web binaries
        run: |
          go mod download
          go mod verify
          mkdir -p artifacts
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}"
            arch="${platform#*/}"
            echo "Building lmdtfy-web-${os}-${arch} (${TAG})..."
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -mod=readonly \
              -trimpath \
              -ldflags="-s -w -X 'main.version=${TAG}'" \
              -o "artifacts/lmdtfy-web-${os}-${arch}" ./cmd/lmdtfy-web
            chmod 0755 "artifacts/lmdtfy-web-${os}-${arch}"
          done

      - name: Smoke test & verify static ELF linkage
        run: |
          out="$(./artifacts/lmdtfy-web-linux-amd64 --version)"
          if [ "$out" != "lmdtfy-web ${TAG}" ]; then
            echo "Smoke test failed: got '$out', expected 'lmdtfy-web ${TAG}'" >&2
            exit 1
          fi
          for bin in artifacts/lmdtfy-web-linux-amd64 artifacts/lmdtfy-web-linux-arm64; do
            if readelf -l "$bin" | grep -E 'INTERP|DYNAMIC' >/dev/null; then
              echo "Error: $bin is not statically linked!" >&2
              exit 1
            fi
            echo "✓ Verified static ELF: $bin"
          done

      - name: Package Chrome MV3 extension zip
        run: |
          ext_zip="artifacts/dtfm-web-extension-${TAG}.zip"
          (cd extension && zip -r -X "../${ext_zip}" . -x "test" "test/*")
          unzip -l "${ext_zip}"

      - name: Generate and verify SHA256SUMS
        working-directory: artifacts
        run: |
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          sha256sum --strict -c SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_SHA="$(git rev-parse HEAD)"
          gh release create "$TAG" artifacts/* \
            --target "$RELEASE_SHA" \
            --title "dtfm-web $TAG" \
            --generate-notes
